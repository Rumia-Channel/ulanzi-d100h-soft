<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ulanzi-d100h-soft</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header>
  <h1>Ulanzi D100H</h1>
  <span id="status" class="badge">connecting…</span>
  <span id="fg-app" class="badge">—</span>
  <span id="active-rule" class="badge">rule: —</span>
  <button id="reconnect" type="button">Reconnect</button>
</header>

<main>
  <section class="card" id="device">
    <h2>Device</h2>
    <dl id="device-info">
      <dt>Firmware</dt><dd id="di-firmware">—</dd>
      <dt>Serial</dt><dd id="di-serial">—</dd>
      <dt>Address</dt><dd id="di-address">—</dd>
      <dt>Haptics</dt><dd id="di-haptics">—</dd>
      <dt>Sleep timer</dt><dd id="di-sleep">—</dd>
      <dt>Battery</dt><dd id="di-battery">—</dd>
    </dl>
    <div class="queries">
      Control:
      <label><input type="checkbox" id="ctl-haptics"> haptics</label>
      <select id="ctl-sleep">
        <option value="">sleep…</option>
        <option value="0">off</option>
        <option value="3600">1h</option>
        <option value="7200">2h</option>
        <option value="10800">3h</option>
        <option value="14400">4h</option>
      </select>
      <button id="ctl-apply" type="button">Apply</button>
    </div>
    <div class="queries">
      Query:
      <button data-query="firmware">Firmware</button>
      <button data-query="serial">Serial</button>
      <button data-query="haptics">Haptics</button>
      <button data-query="sleep_timer">Sleep timer</button>
      <button data-query="address">Address</button>
    </div>
  </section>

  <section class="card" id="feed-card">
    <h2>Event feed
      <button id="feed-pause" type="button" class="mini">pause</button>
      <button id="feed-clear" type="button" class="mini">clear</button>
    </h2>
    <ol id="feed" aria-live="polite"></ol>
  </section>

  <section class="card" id="rules-card">
    <h2>App rules <span class="hint">(higher priority wins)</span></h2>
    <label class="row"><input type="checkbox" id="cfg-enabled"> mappings enabled</label>
    <datalist id="proc-list"></datalist>
    <div id="rules"></div>
    <div class="row">
      <button id="add-rule" type="button">+ Add rule</button>
      <button id="save-config" type="button">Save</button>
      <button id="export-config" type="button">Export</button>
      <button id="import-config" type="button">Import</button>
      <span id="save-status" role="status"></span>
    </div>
    <details id="import-box" hidden>
      <summary>Paste config JSON</summary>
      <textarea id="import-text" rows="8" spellcheck="false"></textarea>
      <button id="import-apply" type="button">Validate &amp; save</button>
    </details>
  </section>
</main>

<script src="/assets/app.js"></script>
</body>
</html>
